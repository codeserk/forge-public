{{- if not .Values.existingSecretName }}
{{- if not .Values.tenantID }}
{{- fail "forge-agent: tenantID is required when existingSecretName is not set" }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "forge-agent.fullname" . }}
  labels:
    {{- include "forge-agent.labels" . | nindent 4 }}
type: Opaque
stringData:
  FORGE_TENANT_ID: {{ .Values.tenantID | quote }}
{{- end }}
